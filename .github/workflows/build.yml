name: Build and release extension

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - name: Test packaging
        run: python -m unittest discover -s tests -v
      - name: Verify format against official export
        run: python scripts/verify_upstream.py
      - name: Compile and test extension behavior
        run: dotnet run --project tests/BehaviorTests --configuration Release
      - name: Obtain verified official compatibility assemblies
        if: runner.os == 'Windows'
        run: python scripts/prepare_framework_check.py
      - name: Compile both native code variants and test Framework adapters
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check_framework.ps1
      - name: Build import package
        run: python scripts/build.py
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/build.py --tag "$RELEASE_TAG"
        shell: bash
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: giveaway-list-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build versioned release artifact
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/build.py --tag "$RELEASE_TAG"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "$RELEASE_TAG" dist/*.sb dist/*.sha256
          --verify-tag --latest --title "Giveaway List $RELEASE_TAG"
          --notes-file docs/RELEASE-NOTES.md
